<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080a">
<title>Claude Code Skills 排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080a;
  --surface: #0f0f14;
  --surface2: #16161e;
  --border: #1e1e2a;
  --text: #c8c8d8;
  --text2: #7a7a90;
  --text3: #4a4a5a;
  --amber: #f49b3f;
  --amber-dim: #b8721e;
  --green: #4ade80;
  --green-dim: #1a5c30;
  --red: #f87171;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --star5: #f49b3f;
  --star4: #fbbf24;
  --star3: #a78bfa;
  --star2: #6b7280;
  --star1: #4b5563;
  --radius: 6px;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  --font-display: 'Share Tech Mono', monospace;
  --font-body: 'Noto Sans SC', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#1a1a2e20 0%,transparent 60%),var(--bg)}
body::before{content:'';position:fixed;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

.app{max-width:900px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,var(--amber),#e8792b);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:18px;font-weight:700;color:#0a0a0a;flex-shrink:0}
.title-group h1{font-family:var(--font-display);font-size:20px;font-weight:400;letter-spacing:0.02em;color:var(--text);line-height:1.2}
.title-group span{font-size:11px;color:var(--text2);letter-spacing:0.05em;text-transform:uppercase}
.header-actions{display:flex;gap:8px;align-items:center}
.btn-refresh{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-refresh:hover{background:#1e1e2e;border-color:var(--amber);color:var(--amber)}
.btn-refresh:active{transform:scale(.96)}
.btn-refresh.loading .refresh-icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-icon{width:16px;height:16px;flex-shrink:0}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green)}
.status-dot.offline{background:var(--red);box-shadow:0 0 6px var(--red)}
.status-dot.loading-dot{background:var(--amber);box-shadow:0 0 6px var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:0;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:12px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all .2s;letter-spacing:.03em}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber)}
.tab-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-family:var(--font-mono);font-size:10px;background:var(--surface2);color:var(--text2)}
.tab-btn.active .tab-badge{background:var(--amber);color:#0a0a0a}
.tab-content{display:none;animation:fadeSlide .35s ease}
.tab-content.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.table-wrap::-webkit-scrollbar{height:3px}
.table-wrap::-webkit-scrollbar-track{background:transparent}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
thead th{position:sticky;top:0;background:var(--surface);padding:10px 8px;text-align:left;font-family:var(--font-display);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{padding-left:12px}
tbody td{padding:10px 8px;border-bottom:1px solid #1a1a2400;vertical-align:top;line-height:1.45}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface2)}
tbody tr:hover td{border-bottom-color:var(--border)}
td.rank{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--text3);text-align:center;width:36px}
tr:nth-child(1) td.rank{color:var(--amber)}
tr:nth-child(2) td.rank{color:#c0c0c0}
tr:nth-child(3) td.rank{color:#cd7f32}
td.name{font-weight:600;white-space:nowrap;min-width:120px}
td.name a{color:var(--blue);text-decoration:none;transition:color .15s}
td.name a:hover{color:var(--amber);text-decoration:underline}
td.stars{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--green);white-space:nowrap;text-align:right}
td.growth{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--amber);white-space:nowrap;text-align:right}
td.eval{font-size:12px;color:var(--text2);max-width:260px;min-width:180px}
td.rec{text-align:center;font-size:12px;white-space:nowrap}
td.rec .stars-display{letter-spacing:1px}
td.link{white-space:nowrap;text-align:center}
td.link a{color:var(--text3);text-decoration:none;font-family:var(--font-mono);font-size:10px;transition:color .15s}
td.link a:hover{color:var(--amber)}

/* Recommendation summary */
.summary{margin-top:32px}
.summary h2{font-family:var(--font-display);font-size:16px;font-weight:400;color:var(--text);margin-bottom:16px;letter-spacing:.03em}
.summary h2::before{content:'> ';color:var(--amber)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .2s}
.summary-card:hover{border-color:#2a2a3a}
.summary-card h3{font-family:var(--font-display);font-size:12px;font-weight:400;color:var(--amber);margin-bottom:10px;letter-spacing:.04em;text-transform:uppercase}
.summary-card ul{list-style:none}
.summary-card li{padding:5px 0;font-size:12px;color:var(--text2);border-bottom:1px solid #1a1a2400;display:flex;align-items:flex-start;gap:8px}
.summary-card li::before{content:'•';color:var(--green);font-weight:700;flex-shrink:0}
.summary-card li strong{color:var(--text);font-weight:600}

/* Footer */
.footer{margin-top:32px;padding:16px 0;border-top:1px solid var(--border);text-align:center}
.footer p{font-family:var(--font-mono);font-size:10px;color:var(--text3);letter-spacing:.04em}
.footer .timestamp{color:var(--amber-dim)}
.footer a{color:var(--text2);text-decoration:underline;text-underline-offset:2px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 20px;font-family:var(--font-mono);font-size:12px;color:var(--text);z-index:100;transition:transform .3s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,#1e1e30 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:3px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:480px){
  .header{padding:12px 0}
  .title-group h1{font-size:17px}
  table{font-size:12px;min-width:600px}
  td.eval{max-width:180px;font-size:11px}
  .summary-grid{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="app">
  <header class="header">
    <div class="header-left">
      <div class="logo">CC</div>
      <div class="title-group">
        <h1>Claude Code Skills</h1>
        <span>GitHub 排行榜 · 2026年5月</span>
      </div>
    </div>
    <div class="header-actions">
      <div class="status-dot" id="statusDot" title="在线"></div>
      <button class="btn-refresh" id="btnRefresh" onclick="refreshData()">
        <svg class="refresh-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 4v6h6"/><path d="M23 20v-6h-6"/><path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/></svg>
        <span>刷新数据</span>
      </button>
    </div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchTab('top20')">总榜 Top 20<span class="tab-badge">20</span></button>
    <button class="tab-btn" onclick="switchTab('trending')">飙升榜 Top 10<span class="tab-badge">10</span></button>
  </div>

  <!-- Tab 1: Top 20 -->
  <div class="tab-content active" id="tab-top20">
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>项目</th><th>Stars</th><th>客观评价</th><th>推荐</th><th>链接</th></tr></thead>
        <tbody id="tbody-top20"></tbody>
      </table>
    </div>
  </div>

  <!-- Tab 2: Trending -->
  <div class="tab-content" id="tab-trending">
    <div class="table-wrap">
      <table>
        <thead><tr><th>#</th><th>项目</th><th>Stars</th><th>增速/周</th><th>客观评价</th><th>推荐</th><th>链接</th></tr></thead>
        <tbody id="tbody-trending"></tbody>
      </table>
    </div>
  </div>

  <!-- Summary -->
  <div class="summary">
    <h2>下载建议总结</h2>
    <div class="summary-grid">
      <div class="summary-card">
        <h3>必装 · 人手一份</h3>
        <ul id="summary-must"></ul>
      </div>
      <div class="summary-card">
        <h3>按角色选择</h3>
        <ul id="summary-role"></ul>
      </div>
      <div class="summary-card">
        <h3>保持观望</h3>
        <ul id="summary-watch"></ul>
      </div>
    </div>
  </div>

  <footer class="footer">
    <p>数据来源: GitHub API · 缓存于 <span class="timestamp" id="timestamp">--</span></p>
    <p style="margin-top:4px"><a href="https://github.com/anthropics/skills" target="_blank">anthropics/skills</a> · 添加到主屏幕以安装为 App</p>
  </footer>
</div>

<div class="toast" id="toast"></div>

<script>
// ===== CORE DATA (with expert evaluations) =====
const CORE_DATA = {
  top20: [
    {name:"obra/superpowers",stars:195000,gh:"obra/superpowers",eval:"社区影响力最大的Skills合集，20+子技能覆盖TDD/调试/审查/规划全流程。Anthropic官方认可。体量大，全装可能拖慢加载。",rec:5},
    {name:"affaan-m/everything-claude-code",stars:183000,gh:"affaan-m/everything-claude-code",eval:"58Agent+220Skill+74命令的超级全家桶，Anthropic黑客松冠军。覆盖面无人能及，但内容良莠不齐，全套安装适得其反。",rec:3},
    {name:"anthropics/skills",stars:137000,gh:"anthropics/skills",eval:"官方18个Skills：文档处理(docx/pdf/pptx/xlsx)+mcp-builder+skill-creator。质量最高、维护最稳定，覆盖面偏窄。",rec:5},
    {name:"forrestchang/andrej-karpathy-skills",stars:120000,gh:"forrestchang/andrej-karpathy-skills",eval:"单文件CLAUDE.md，Karpathy四大原则的Skill化实现。内容精炼但体量小——读完比装完更有价值。",rec:4},
    {name:"farion1231/cc-switch",stars:72000,gh:"farion1231/cc-switch",eval:"跨平台桌面应用，一键在Claude Code/Codex/Gemini CLI间切换。功能实用但单一，只用Claude Code则完全不需要。",rec:3},
    {name:"JuliusBrussee/caveman",stars:61000,gh:"JuliusBrussee/caveman",eval:"Token优化专用技能，实测节省~65%token消耗。省钱效果立竿见影，重度用户值得装。只做一件事。",rec:4},
    {name:"shanraisshan/claude-code-best-practice",stars:53000,gh:"shanraisshan/claude-code-best-practice",eval:"从「氛围编程」到「工程化编程」的进阶指南。内容质量高但偏教学向——教你怎么写Skill而非直接干活。",rec:4},
    {name:"ruvnet/ruflo",stars:51000,gh:"ruvnet/ruflo",eval:"100+专业化Agent蜂群编排平台。功能强大但配置复杂，适合需要并行处理大规模任务的团队。",rec:3},
    {name:"mattpocock/skills",stars:45000,gh:"mattpocock/skills",eval:"TypeScript圈最实用生产级Skills。grill-me/tdd/diagnose三大技能经过验证。非TS开发者收益减半。",rec:5},
    {name:"sickn33/antigravity-awesome-skills",stars:38000,gh:"sickn33/antigravity-awesome-skills",eval:"1,400+Skills百科全书，9大分类。作为发现Skills的入口极好，但纯索引——你得自己去装具体的。",rec:3},
    {name:"FridrichMethod/awesome-skills",stars:35000,gh:"FridrichMethod/awesome-skills",eval:"1,800+精选Skills，每周自动从14个上游同步。数量碾压但Snyk扫描显示36%有安全缺陷——安全审核不足是硬伤。",rec:3},
    {name:"wshobson/agents",stars:35000,gh:"wshobson/agents",eval:"150+预置Agent角色Skills库，QA/SEO/iOS全覆盖。角色定义偏简单，实际效果依赖使用方式。",rec:3},
    {name:"rohitg00/awesome-claude-code-toolkit",stars:30000,gh:"rohitg00/awesome-claude-code-toolkit",eval:"最全面工具包：135Agent+35Skill+42命令+176插件+14MCP。一站式但内容太多，建议按需取用。",rec:3},
    {name:"K-Dense-AI/claude-scientific-skills",stars:24000,gh:"K-Dense-AI/claude-scientific-skills",eval:"135个科研专用Skill跨10学科。学术场景唯一选择。研究员/博士生必装，其他人完全用不上。",rec:4},
    {name:"VoltAgent/awesome-agent-skills",stars:22000,gh:"VoltAgent/awesome-agent-skills",eval:"企业团队类Skills聚合，侧重代码审查流程/发布管理/文档同步。适合团队引入。",rec:3},
    {name:"MarcelRoozekrans/superpowers-extensions",stars:18000,gh:"MarcelRoozekrans/superpowers-extensions",eval:"Superpowers官方扩展包：回归测试/pre-push审查/重构分析。Superpowers用户必装，其他人需先装主体。",rec:4},
    {name:"Jamie-BitFlight/claude_skills",stars:15000,gh:"Jamie-BitFlight/claude_skills",eval:"老牌Skills市场，15+插件(Python/Bash/Perl/CI/CD)。质量稳定但更新频率下降，部分依赖较旧。",rec:3},
    {name:"jeremylongshore/claude-code-plugins-plus-skills",stars:12000,gh:"jeremylongshore/claude-code-plugins-plus-skills",eval:"插件+Skills二合一，v4.20持续迭代。活跃维护中但社区较小。",rec:3},
    {name:"Mizoreww/awesome-claude-code-config",stars:10000,gh:"Mizoreww/awesome-claude-code-config",eval:"生产级配置：23插件+对抗审查Skill+论文阅读Skill+自改进循环。质量高但宣传不够导致Stars偏低，值得关注。",rec:3},
    {name:"jacexh/skill-workshop",stars:8000,gh:"jacexh/skill-workshop",eval:"Claude Code插件市场，专注生产力工具。安装体验流畅但上架项目不多，还不成规模。",rec:2}
  ],
  trending: [
    {name:"mattpocock/skills",stars:45000,growth:"+1,618",gh:"mattpocock/skills",eval:"飙升榜首增速与内容质量高度匹配。「Real Engineering, Not Vibe Coding」击中开发者痛点。",rec:5},
    {name:"JuliusBrussee/caveman",stars:61000,growth:"+1,200",gh:"JuliusBrussee/caveman",eval:"Token优化是刚需——谁不想省钱？增速合理但效果上限取决于使用方式。",rec:4},
    {name:"forrestchang/andrej-karpathy-skills",stars:120000,growth:"+1,117",gh:"forrestchang/andrej-karpathy-skills",eval:"Karpathy个人品牌加持占很大比重。增速部分来自「膜拜效应」而非产品力。",rec:4},
    {name:"obra/superpowers",stars:195000,growth:"+951",gh:"obra/superpowers",eval:"增速稳定而非昙花一现——社区在认真采用这套方法论。没有竞品能在方法论层面挑战它。",rec:5},
    {name:"shanraisshan/claude-code-best-practice",stars:53000,growth:"+900",gh:"shanraisshan/claude-code-best-practice",eval:"「Vibe Coding→Agentic Engineering」叙事精准抓住社区情绪。教学内容质量高。",rec:4},
    {name:"farion1231/cc-switch",stars:72000,growth:"+866",gh:"farion1231/cc-switch",eval:"增速反映多模型切换强需求。但功能单一，Claude Code官方可能未来内置此功能。",rec:3},
    {name:"affaan-m/everything-claude-code",stars:183000,growth:"+858",gh:"affaan-m/everything-claude-code",eval:"增速来自「一站式」需求红利。大量Skills你永远不会触发，挑着用更好。",rec:3},
    {name:"FridrichMethod/awesome-skills",stars:35000,growth:"+800",gh:"FridrichMethod/awesome-skills",eval:"1,800+Skills体量是核心竞争力。但36%安全缺陷率是硬伤——增速可持续性取决于审核机制。",rec:3},
    {name:"K-Dense-AI/claude-scientific-skills",stars:24000,growth:"+700",gh:"K-Dense-AI/claude-scientific-skills",eval:"科研专用赛道无竞品，增速来自学术界口口相传。天花板很高。",rec:4},
    {name:"MarcelRoozekrans/superpowers-extensions",stars:18000,growth:"+600",gh:"MarcelRoozekrans/superpowers-extensions",eval:"Superpowers用户群溢出效应。本身质量好但受众限于已装Superpowers的用户。",rec:4}
  ]
};

const REC_LABELS = {5:'⭐⭐⭐⭐⭐',4:'⭐⭐⭐⭐',3:'⭐⭐⭐',2:'⭐⭐',1:'⭐'};
const REC_CLASS = {5:'star5',4:'star4',3:'star3',2:'star2',1:'star1'};

// ===== RENDER =====
function starDisplay(rec){return `<span class="stars-display" style="color:var(--star${rec})">${REC_LABELS[rec]}</span>`;}

function renderRow(item,idx,isTrending){
  const ghUrl = `https://github.com/${item.gh}`;
  let html = `<tr style="animation-delay:${idx*40}ms">`;
  html += `<td class="rank">${idx+1}</td>`;
  html += `<td class="name"><a href="${ghUrl}" target="_blank" rel="noopener">${item.name}</a></td>`;
  html += `<td class="stars">${(item.stars/1000).toFixed(0)}K</td>`;
  if(isTrending) html += `<td class="growth">${item.growth}/周</td>`;
  html += `<td class="eval">${item.eval}</td>`;
  html += `<td class="rec">${starDisplay(item.rec)}</td>`;
  html += `<td class="link"><a href="${ghUrl}" target="_blank" rel="noopener">GH ↗</a></td>`;
  html += `</tr>`;
  return html;
}

function renderAll(){
  document.getElementById('tbody-top20').innerHTML = CORE_DATA.top20.map((item,i)=>renderRow(item,i,false)).join('');
  document.getElementById('tbody-trending').innerHTML = CORE_DATA.trending.map((item,i)=>renderRow(item,i,true)).join('');
  // Summary
  document.getElementById('summary-must').innerHTML = [

// ===== TIMESTAMP =====
function updateTimestamp(){
  const now = new Date();
  document.getElementById('timestamp').textContent =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
}

// ===== TABS =====
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(tab==='top20'&&i===0)||(tab==='trending'&&i===1));
  });
  document.getElementById('tab-top20').classList.toggle('active',tab==='top20');
  document.getElementById('tab-trending').classList.toggle('active',tab==='trending');
}

// ===== GITHUB API REFRESH =====
async function refreshData(){
  const btn = document.getElementById('btnRefresh');
  const dot = document.getElementById('statusDot');
  btn.classList.add('loading');
  dot.className = 'status-dot loading-dot';
  showToast('正在从 GitHub 拉取最新数据...');

  try {
    const updates = {};
    // Search for known repos to get fresh star counts
    const allRepos = [...CORE_DATA.top20, ...CORE_DATA.trending];
    const uniqueRepos = [...new Set(allRepos.map(r=>r.gh))];

    // Batch into groups of 10 (GitHub API limitation for batch)
    for(let i=0;i<uniqueRepos.length;i+=10){
      const batch = uniqueRepos.slice(i,i+10);
      const promises = batch.map(repo =>
        fetch(`https://api.github.com/repos/${repo}`)
          .then(r=>r.ok?r.json():null)
          .catch(()=>null)
      );
      const results = await Promise.all(promises);
      results.forEach((data,idx)=>{
        if(data&&data.stargazers_count){
          updates[batch[idx]] = data.stargazers_count;
        }
      });
    }

    // Apply updates
    let updated = 0;
    CORE_DATA.top20.forEach(item=>{
      if(updates[item.gh] && updates[item.gh] !== item.stars){
        item.stars = updates[item.gh];
        updated++;
      }
    });
    CORE_DATA.trending.forEach(item=>{
      if(updates[item.gh] && updates[item.gh] !== item.stars){
        item.stars = updates[item.gh];
        updated++;
      }
    });

    // Also search for new trending repos
    const searchRes = await fetch('https://api.github.com/search/repositories?q=claude+code+skills+SKILL.md&sort=stars&order=desc&per_page=5')
      .then(r=>r.ok?r.json():null)
      .catch(()=>null);

    renderAll();
    // Cache to localStorage
    localStorage.setItem('cc-skills-data', JSON.stringify({
      top20: CORE_DATA.top20,
      trending: CORE_DATA.trending,
      timestamp: Date.now()
    }));

    dot.className = 'status-dot';
    btn.classList.remove('loading');
    const newMsg = searchRes ? ` · 新发现 ${searchRes.total_count} 个仓库` : '';
    showToast(`已更新 ${updated} 个星标数据${newMsg}`, 'success');
  } catch(e){
    dot.className = 'status-dot offline';
    btn.classList.remove('loading');
    showToast('获取失败，显示缓存数据', 'error');
    console.error('Refresh error:', e);
  }
}

// ===== TOAST =====
let toastTimer;
function showToast(msg,type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast '+(type||'')+' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{t.className='toast'},2500);
}

// ===== PWA SETUP =====
function setupPWA(){
  // Manifest as blob
  const manifest = {
    name:'Claude Code Skills 排行榜',
    short_name:'CC Skills',
    start_url:location.href,
    display:'standalone',
    background_color:'#08080a',
    theme_color:'#08080a',
    description:'GitHub Claude Code Skills 生态排行榜',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="32" fill="#0f0f14"/><text x="96" y="110" text-anchor="middle" font-family="monospace" font-size="64" font-weight="bold" fill="#f49b3f">CC</text><text x="96" y="150" text-anchor="middle" font-family="monospace" font-size="22" fill="#4ade80">SKILLS</text></svg>'),sizes:'192x192',type:'image/svg+xml'}]
  };
  const manifestBlob = new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const manifestUrl = URL.createObjectURL(manifestBlob);
  document.querySelector('link[rel="manifest"]')||(()=>{
    const link = document.createElement('link');
    link.rel='manifest';link.href=manifestUrl;
    document.head.appendChild(link);
  })();

  // Service Worker
  if('serviceWorker' in navigator){
    const swCode = `
const CACHE='cc-skills-v2';
const URLS=['${location.href}'];
self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(URLS)).then(()=>self.skipWaiting()))});
self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==CACHE).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});
self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{if(resp.ok){const clone=resp.clone();caches.open(CACHE).then(c=>c.put(e.request,clone))}return resp}).catch(()=>caches.match(e.request))))});
`;
    const swBlob = new Blob([swCode],{type:'application/javascript'});
    const swUrl = URL.createObjectURL(swBlob);
    navigator.serviceWorker.register(swUrl).catch(()=>{});
  }
}

// ===== INIT =====
function init(){
  // Try to load cached data
  const cached = localStorage.getItem('cc-skills-data');
  if(cached){
    try{
      const data = JSON.parse(cached);
      // Merge cached star counts (preserve evaluations)
      data.top20.forEach((cachedItem,i)=>{
        if(CORE_DATA.top20[i] && cachedItem.stars) CORE_DATA.top20[i].stars = cachedItem.stars;
      });
      data.trending.forEach((cachedItem,i)=>{
        if(CORE_DATA.trending[i] && cachedItem.stars) CORE_DATA.trending[i].stars = cachedItem.stars;
      });
      const age = Date.now() - (data.timestamp||0);
      if(age<3600000) document.getElementById('statusDot').title = `缓存于 ${Math.round(age/60000)} 分钟前`;
    }catch(e){}
  }
  renderAll();
  setupPWA();
  updateTimestamp();
}

document.addEventListener('DOMContentLoaded',init);
</script>
