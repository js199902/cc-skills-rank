<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080a">
<title>Claude Code Skills 排行榜</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=JetBrains+Mono:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #08080a;
  --surface: #0f0f14;
  --surface2: #16161e;
  --border: #1e1e2a;
  --text: #c8c8d8;
  --text2: #7a7a90;
  --text3: #4a4a5a;
  --amber: #f49b3f;
  --amber-dim: #b8721e;
  --green: #4ade80;
  --green-dim: #1a5c30;
  --red: #f87171;
  --blue: #60a5fa;
  --purple: #a78bfa;
  --star5: #f49b3f;
  --star4: #fbbf24;
  --star3: #a78bfa;
  --star2: #6b7280;
  --star1: #4b5563;
  --radius: 6px;
  --font-mono: 'JetBrains Mono', 'Courier New', monospace;
  --font-display: 'Share Tech Mono', monospace;
  --font-body: 'Noto Sans SC', system-ui, sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--text);font-family:var(--font-body);-webkit-font-smoothing:antialiased}
body{min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#1a1a2e20 0%,transparent 60%),var(--bg)}
body::before{content:'';position:fixed;inset:0;opacity:.03;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");pointer-events:none;z-index:0}

.app{max-width:900px;margin:0 auto;padding:16px;position:relative;z-index:1}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;padding:20px 0 16px;border-bottom:1px solid var(--border);margin-bottom:20px;flex-wrap:wrap;gap:12px}
.header-left{display:flex;align-items:center;gap:12px}
.logo{width:40px;height:40px;background:linear-gradient(135deg,var(--amber),#e8792b);border-radius:8px;display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-size:18px;font-weight:700;color:#0a0a0a;flex-shrink:0}
.title-group h1{font-family:var(--font-display);font-size:20px;font-weight:400;letter-spacing:0.02em;color:var(--text);line-height:1.2}
.title-group span{font-size:11px;color:var(--text2);letter-spacing:0.05em;text-transform:uppercase}
.header-actions{display:flex;gap:8px;align-items:center}
.btn-refresh{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:12px;cursor:pointer;transition:all .2s;white-space:nowrap}
.btn-refresh:hover{background:#1e1e2e;border-color:var(--amber);color:var(--amber)}
.btn-refresh:active{transform:scale(.96)}
.btn-refresh.loading .refresh-icon{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.refresh-icon{width:16px;height:16px;flex-shrink:0}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;box-shadow:0 0 6px var(--green)}
.status-dot.offline{background:var(--red);box-shadow:0 0 6px var(--red)}
.status-dot.loading-dot{background:var(--amber);box-shadow:0 0 6px var(--amber);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:0;border-bottom:1px solid var(--border)}
.tab-btn{flex:1;padding:12px 20px;background:none;border:none;border-bottom:2px solid transparent;color:var(--text2);font-family:var(--font-display);font-size:14px;cursor:pointer;transition:all .2s;letter-spacing:.03em}
.tab-btn:hover{color:var(--text)}
.tab-btn.active{color:var(--amber);border-bottom-color:var(--amber)}
.tab-badge{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:10px;font-family:var(--font-mono);font-size:10px;background:var(--surface2);color:var(--text2)}
.tab-btn.active .tab-badge{background:var(--amber);color:#0a0a0a}
.tab-content{display:none;animation:fadeSlide .35s ease}
.tab-content.active{display:block}
@keyframes fadeSlide{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

/* Table */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.table-wrap::-webkit-scrollbar{height:3px}
.table-wrap::-webkit-scrollbar-track{background:transparent}
.table-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:700px}
thead th{position:sticky;top:0;background:var(--surface);padding:10px 8px;text-align:left;font-family:var(--font-display);font-size:10px;font-weight:400;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;border-bottom:1px solid var(--border);white-space:nowrap}
thead th:first-child{padding-left:12px}
tbody td{padding:10px 8px;border-bottom:1px solid #1a1a2400;vertical-align:top;line-height:1.45}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface2)}
tbody tr:hover td{border-bottom-color:var(--border)}
td.rank{font-family:var(--font-mono);font-size:14px;font-weight:700;color:var(--text3);text-align:center;width:36px}
tr:nth-child(1) td.rank{color:var(--amber)}
tr:nth-child(2) td.rank{color:#c0c0c0}
tr:nth-child(3) td.rank{color:#cd7f32}
td.name{font-weight:600;white-space:nowrap;min-width:120px}
td.name a{color:var(--blue);text-decoration:none;transition:color .15s}
td.name a:hover{color:var(--amber);text-decoration:underline}
td.stars{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--green);white-space:nowrap;text-align:right}
td.growth{font-family:var(--font-mono);font-size:12px;font-weight:600;color:var(--amber);white-space:nowrap;text-align:right}
td.eval{font-size:12px;color:var(--text2);max-width:260px;min-width:180px}
td.rec{text-align:center;font-size:12px;white-space:nowrap}
td.rec .stars-display{letter-spacing:1px}
td.link{white-space:nowrap;text-align:center}
td.link a{color:var(--text3);text-decoration:none;font-family:var(--font-mono);font-size:10px;transition:color .15s}
td.link a:hover{color:var(--amber)}

/* Recommendation summary */
.summary{margin-top:32px}
.summary h2{font-family:var(--font-display);font-size:16px;font-weight:400;color:var(--text);margin-bottom:16px;letter-spacing:.03em}
.summary h2::before{content:'> ';color:var(--amber)}
.summary-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.summary-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;transition:border-color .2s}
.summary-card:hover{border-color:#2a2a3a}
.summary-card h3{font-family:var(--font-display);font-size:12px;font-weight:400;color:var(--amber);margin-bottom:10px;letter-spacing:.04em;text-transform:uppercase}
.summary-card ul{list-style:none}
.summary-card li{padding:5px 0;font-size:12px;color:var(--text2);border-bottom:1px solid #1a1a2400;display:flex;align-items:flex-start;gap:8px}
.summary-card li::before{content:'•';color:var(--green);font-weight:700;flex-shrink:0}
.summary-card li strong{color:var(--text);font-weight:600}

/* Footer */
.footer{margin-top:32px;padding:16px 0;border-top:1px solid var(--border);text-align:center}
.footer p{font-family:var(--font-mono);font-size:10px;color:var(--text3);letter-spacing:.04em}
.footer .timestamp{color:var(--amber-dim)}
.footer a{color:var(--text2);text-decoration:underline;text-underline-offset:2px}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:10px 20px;font-family:var(--font-mono);font-size:12px;color:var(--text);z-index:100;transition:transform .3s ease;pointer-events:none;white-space:nowrap}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.success{border-color:var(--green);color:var(--green)}
.toast.error{border-color:var(--red);color:var(--red)}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,#1e1e30 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:3px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

@media(max-width:480px){
  .header{padding:12px 0}
  .title-group h1{font-size:17px}
  table{font-size:12px;min-width:600px}
  td.eval{max-width:180px;font-size:11px}
  .summary-grid{grid-template-columns:1fr}
}
</style>
</head>

  ],
  trending: [
    {name:"mattpocock/skills",stars:45000,growth:"+1,618",gh:"mattpocock/skills",eval:"飙升榜首，Real Engineering, Not Vibe Coding击中开发者痛点。",rec:5},

let currentData = JSON.parse(JSON.stringify(SEED_DATA));
let dataMode = 'seed'; // 'seed' | 'live'

const REC_LABELS = {5:'⭐⭐⭐⭐⭐',4:'⭐⭐⭐⭐',3:'⭐⭐⭐',2:'⭐⭐',1:'⭐'};

// ===== AUTO-EVALUATION ENGINE =====
function autoEvaluate(repo){
  const name = repo.full_name.toLowerCase();
  const desc = (repo.description||'').toLowerCase();
  const stars = repo.stargazers_count;
  const hasLicense = !!repo.license;
  const daysSinceCreation = Math.max(1, (Date.now() - new Date(repo.created_at).getTime()) / 86400000);
  const starsPerDay = stars / daysSinceCreation;

  let rec = 3;
  let evalText = '';

  // Official Anthropic repos
  if(name.startsWith('anthropics/')){
    rec = 5;
    evalText = 'Anthropic官方出品，质量最高、维护最稳定。Claude Code生态核心。';
  }
  // Super high quality signal
  else if(stars > 50000 && hasLicense){
    rec = 5;
    evalText = `社区标杆项目，${(stars/1000).toFixed(0)}K开发者用星标投票。文档完善，生态成熟。`;
  }
  // High quality
  else if(stars > 20000 && hasLicense){
    rec = 4;
    evalText = `优质项目，社区活跃。${desc ? '定位清晰：'+desc.slice(0,40)+'...' : ''}`;
  }
  // Rapid growth
  else if(starsPerDay > 50){
    rec = 4;
    evalText = `增速惊人(${starsPerDay.toFixed(0)}星/天)，热度与质量匹配中，值得关注。`;
  }
  // Curated / awesome lists
  else if(name.includes('awesome')||desc.includes('curated')||desc.includes('collection')){
    rec = 3;
    evalText = '精选合集，作为发现入口极好。但本质是索引——你得自己去装具体的Skills。';
  }
  // Niche domain
  else if(desc.includes('scientific')||desc.includes('research')||desc.includes('security')||desc.includes('finance')){
    rec = 4;
    evalText = `垂直领域专用${desc.includes('scientific')?'科研':desc.includes('security')?'安全':desc.includes('finance')?'金融':'专业'}Skills。对应角色必装，其他人用不上。`;
  }
  // Small / new
  else if(stars < 5000){
    rec = 2;
    evalText = '新兴项目，社区尚小。有潜力但暂未经过大规模验证，建议观望。';
  }
  // Medium
  else if(stars < 15000){
    rec = 3;
    evalText = '中等规模项目。按需选择——如果你正好需要它的功能，值得一试。';
  }
  // Large
  else {
    rec = 4;
    evalText = desc ? desc.slice(0,60) + '...' : '热门项目，社区活跃。';
  }

  // Refine: very large stars = at least 4
  if(stars > 100000 && rec < 4) rec = 4;

  return { eval: evalText, rec: rec };
}

// ===== GITHUB API: DYNAMIC SEARCH =====
async function searchGitHub(query, sort='stars', perPage=30){
  const url = `https://api.github.com/search/repositories?q=${encodeURIComponent(query)}&sort=${sort}&order=desc&per_page=${perPage}`;
  const resp = await fetch(url);
  if(!resp.ok) throw new Error(`GitHub API error: ${resp.status}`);
  const json = await resp.json();
  return json.items || [];
}

async function fetchRepoDetails(fullName){
  const resp = await fetch(`https://api.github.com/repos/${fullName}`);
  if(!resp.ok) return null;
  return resp.json();
}

// ===== REFRESH: Real-time dynamic search =====
async function refreshData(){
  const btn = document.getElementById('btnRefresh');
  const dot = document.getElementById('statusDot');
  btn.classList.add('loading');
  dot.className = 'status-dot loading-dot';
  document.getElementById('btnRefresh').querySelector('span').textContent = '搜索中...';
  showToast('实时搜索 GitHub，获取最新排名...');

  try {
    // Multi-query search for comprehensive coverage
    const queries = [
      'claude skills SKILL.md',
      'claude-code skills',
      '.claude skills agent'
    ];

    // Run all searches in parallel
    const allResults = await Promise.all(queries.map(q => searchGitHub(q, 'stars', 20)));
    showToast('分析项目中...');

    // Merge & deduplicate
    const seen = new Set();
    const merged = [];
    for(const items of allResults){
      for(const item of items){
        if(!seen.has(item.full_name)){
          seen.add(item.full_name);
          merged.push(item);
        }
      }
    }

    // Filter: only Claude Code skills repos (exclude general AI frameworks)
    const keywords = ['skill','claude','superpower','caveman','SKILL.md','.claude','agent-skill','skills'];
    const filtered = merged.filter(r => {
      const text = (r.full_name+' '+r.description+' '+(r.topics||[]).join(' ')).toLowerCase();
      return keywords.some(k => text.includes(k));
    });

    // Sort by stars
    filtered.sort((a,b) => b.stargazers_count - a.stargazers_count);

    // Build Top 20 with auto-evaluations
    const top20Raw = filtered.slice(0, 20);
    const top20 = top20Raw.map(r => ({
      name: r.full_name,
      stars: r.stargazers_count,
      gh: r.full_name,
      ...autoEvaluate(r)
    }));

    // Build Trending 10 (by stars per day)
    const withGrowth = filtered.map(r => ({
      ...r,
      _spd: r.stargazers_count / Math.max(1, (Date.now() - new Date(r.created_at).getTime()) / 86400000)
    }));
    withGrowth.sort((a,b) => b._spd - a._spd);
    const trending = withGrowth.slice(0, 10).map(r => ({
      name: r.full_name,
      stars: r.stargazers_count,
      growth: '+' + Math.round(r._spd * 7).toLocaleString(),
      gh: r.full_name,
      ...autoEvaluate(r)
    }));

    // Update living data
    currentData = { top20, trending };
    dataMode = 'live';

    // Auto-generate summary recommendations
    const official = top20.filter(r => r.gh.startsWith('anthropics/'));
    const top5 = top20.filter(r => r.rec === 5);
    const top4 = top20.filter(r => r.rec >= 4);
    const only23 = top20.filter(r => r.rec <= 3 && r.rec >= 2);

    window._summaryMust = top5.slice(0,4).map(r => `<li><strong>${r.name}</strong> — ${r.eval.slice(0,50)}</li>`);
    window._summaryRole = [
      `<li><strong>前端/TS</strong> → ${top4.filter(r=>r.gh.includes('matt')||r.gh.includes('vercel')).map(r=>r.name.split('/')[1]).join(' + ')||'搜索中'}</li>`,
      `<li><strong>后端/全栈</strong> → ${top4.filter(r=>r.gh.includes('superpower')||r.gh.includes('best-practice')).map(r=>r.name.split('/')[1]).join(' + ')||top4.slice(0,2).map(r=>r.name).join(' + ')}</li>`,
      `<li><strong>学术/研究</strong> → ${top4.filter(r=>r.gh.includes('scien')||r.gh.includes('karpathy')).map(r=>r.name.split('/')[1]).join(' + ')||'搜索中'}</li>`,
      `<li><strong>团队</strong> → ${top4.filter(r=>r.gh.includes('volt')||r.gh.includes('extension')||r.gh.includes('agent-skill')).map(r=>r.name.split('/')[1]).join(' + ')||'搜索中'}</li>`,
      `<li><strong>省钱</strong> → ${top4.filter(r=>r.gh.includes('caveman')).map(r=>r.name.split('/')[1]).join(' + ')||'搜索中'}</li>`
    ];
    window._summaryWatch = only23.slice(0,4).map(r => `<li><strong>${r.name.split('/')[1]||r.name}</strong> — ${r.eval.slice(0,40)}</li>`);

    // Save to cache
    localStorage.setItem('cc-skills-data', JSON.stringify({
      top20, trending, mode: 'live', timestamp: Date.now(),
      summaryMust: window._summaryMust,
      summaryRole: window._summaryRole,
      summaryWatch: window._summaryWatch
    }));

    renderAll();
    dot.className = 'status-dot';
    document.getElementById('btnRefresh').querySelector('span').textContent = '刷新数据';
    btn.classList.remove('loading');
    showToast(`实时数据 · 共发现 ${filtered.length} 个相关仓库`, 'success');
  } catch(e){
    dot.className = 'status-dot offline';
    document.getElementById('btnRefresh').querySelector('span').textContent = '刷新数据';
    btn.classList.remove('loading');
    showToast('API 限流或无网络，显示缓存数据', 'error');
    console.error('Refresh error:', e);
  }
}

// ===== RENDER =====
function starDisplay(rec){return `<span class="stars-display" style="color:var(--star${rec})">${REC_LABELS[rec]}</span>`;}

function renderRow(item,idx,isTrending){
  const ghUrl = `https://github.com/${item.gh}`;
  let html = `<tr style="animation-delay:${idx*35}ms">`;
  html += `<td class="rank">${idx+1}</td>`;
  html += `<td class="name"><a href="${ghUrl}" target="_blank" rel="noopener">${item.name}</a></td>`;
  html += `<td class="stars">${item.stars>=1000?(item.stars/1000).toFixed(1)+'K':item.stars}</td>`;
  if(isTrending) html += `<td class="growth">${item.growth||'--'}/周</td>`;
  html += `<td class="eval">${item.eval||''}</td>`;
  html += `<td class="rec">${starDisplay(item.rec)}</td>`;
  html += `<td class="link"><a href="${ghUrl}" target="_blank" rel="noopener">GH ↗</a></td>`;
  html += `</tr>`;
  return html;
}

function renderAll(){
  document.getElementById('subtitle').textContent = `GitHub 排行榜 · ${dataMode==='live'?'实时数据':'缓存模式'}`;
  document.getElementById('tbody-top20').innerHTML = currentData.top20.map((item,i)=>renderRow(item,i,false)).join('');
  document.getElementById('tbody-trending').innerHTML = currentData.trending.map((item,i)=>renderRow(item,i,true)).join('');

  // Summary - use cached dynamic or fallback to static defaults
  const defaults = {
    must: ['<li><strong>anthropics/skills</strong> — 官方文档处理，人手必备</li>','<li><strong>obra/superpowers</strong> — TDD→调试→审查→部署一条龙</li>','<li><strong>mattpocock/skills</strong> — TS/JS开发者唯一必装</li>'],
    role: ['<li><strong>前端/TS</strong> → superpowers + mattpocock + anthropics</li>','<li><strong>后端/全栈</strong> → superpowers + anthropics + best-practice</li>','<li><strong>学术</strong> → K-Dense-AI/scientific-skills + superpowers</li>','<li><strong>团队</strong> → VoltAgent + superpowers-extensions</li>','<li><strong>省钱</strong> → caveman（省~65%token）</li>'],
    watch: ['<li><strong>ECC</strong> — 内容太杂，等社区筛选</li>','<li><strong>FridrichMethod</strong> — 36%有安全缺陷</li>','<li><strong>cc-switch</strong> — 功能单一，可能被官方内置</li>','<li><strong>skill-workshop</strong> — 规模太小</li>']
  };
  document.getElementById('summary-must').innerHTML = (window._summaryMust||defaults.must).join('');
  document.getElementById('summary-role').innerHTML = (window._summaryRole||defaults.role).join('');
  document.getElementById('summary-watch').innerHTML = (window._summaryWatch||defaults.watch).join('');
  updateTimestamp();
}

// ===== TIMESTAMP =====
function updateTimestamp(){
  const now = new Date();
  const modeLabel = dataMode==='live'?'实时':'缓存';
  document.getElementById('timestamp').textContent =
    `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')} (${modeLabel})`;
}

// ===== TABS =====
function switchTab(tab){
  document.querySelectorAll('.tab-btn').forEach((b,i)=>{
    b.classList.toggle('active',(tab==='top20'&&i===0)||(tab==='trending'&&i===1));
  });
  document.getElementById('tab-top20').classList.toggle('active',tab==='top20');
  document.getElementById('tab-trending').classList.toggle('active',tab==='trending');
}

// ===== TOAST =====
let toastTimer;
function showToast(msg,type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast '+(type||'')+' show';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{t.className='toast'},2500);
}

// ===== PWA SETUP =====
function setupPWA(){
  const manifest = {
    name:'Claude Code Skills 排行榜',
    short_name:'CC Skills',
    start_url:location.href,
    display:'standalone',
    background_color:'#08080a',
    theme_color:'#08080a',
    description:'GitHub Claude Code Skills 生态实时排行榜',
    icons:[{src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192"><rect width="192" height="192" rx="32" fill="#0f0f14"/><text x="96" y="110" text-anchor="middle" font-family="monospace" font-size="64" font-weight="bold" fill="#f49b3f">CC</text><text x="96" y="150" text-anchor="middle" font-family="monospace" font-size="22" fill="#4ade80">SKILLS</text></svg>'),sizes:'192x192',type:'image/svg+xml'}]
  };
  const blob = new Blob([JSON.stringify(manifest)],{type:'application/json'});
  const link = document.createElement('link');
  link.rel='manifest';link.href=URL.createObjectURL(blob);
  document.head.appendChild(link);

  if('serviceWorker' in navigator){
    const sw = `const C='cc-skills-v3';self.addEventListener('install',e=>{e.waitUntil(caches.open(C).then(c=>c.addAll(['${location.href}'])).then(()=>self.skipWaiting()))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(ks=>Promise.all(ks.filter(k=>k!==C).map(k=>caches.delete(k)))).then(()=>self.clients.claim()))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).then(resp=>{if(resp.ok){const cl=resp.clone();caches.open(C).then(c=>c.put(e.request,cl))}return resp}).catch(()=>caches.match(e.request))))});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'}))).catch(()=>{});
  }
}

// ===== INIT =====
function init(){
  const cached = localStorage.getItem('cc-skills-data');
  if(cached){
    try{
      const data = JSON.parse(cached);
      if(data.top20&&data.top20.length>0){
        currentData = { top20: data.top20, trending: data.trending||data.top20.slice(0,10) };
        dataMode = data.mode||'cached';
        window._summaryMust = data.summaryMust||null;
        window._summaryRole = data.summaryRole||null;
        window._summaryWatch = data.summaryWatch||null;
      }
      const age = Date.now() - (data.timestamp||0);
      if(age<3600000) document.getElementById('statusDot').title = `${dataMode==='live'?'实时':'缓存'} · ${Math.round(age/60000)}分钟前`;
    }catch(e){}
  }
  renderAll();
  setupPWA();
  updateTimestamp();
}

document.addEventListener('DOMContentLoaded',init);
</script>
